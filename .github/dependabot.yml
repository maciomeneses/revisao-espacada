# Dependabot — só security updates (como antes), agora agrupados: um PR por diretório em vez
# de um por pacote. `open-pull-requests-limit: 0` mantém desligadas as atualizações de versão
# rotineiras; os grupos com `applies-to: security-updates` juntam as correções de segurança.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Recife
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      seguranca-frontend:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Recife
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      seguranca-raiz:
        applies-to: security-updates
        patterns: ["*"]

  - package-ecosystem: gradle
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Recife
    open-pull-requests-limit: 0
    commit-message:
      prefix: "chore(deps)"
    groups:
      seguranca-backend:
        applies-to: security-updates
        patterns: ["*"]
