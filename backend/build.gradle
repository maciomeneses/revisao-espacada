plugins {
    id 'java'
    id 'org.springframework.boot' version '4.0.3'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'jacoco'
    // OWASP Dependency-Check — varredura de CVEs nas dependências do projeto
    id 'org.owasp.dependencycheck' version '12.1.1'
}

group = 'com.ebbin'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'

    // JWT (JJWT 0.12.x)
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Flyway — migrações de schema para o perfil de produção
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // Bucket4j — rate limiting em memória para endpoints críticos
    implementation 'com.bucket4j:bucket4j-core:8.10.1'

    // Caffeine — cache com TTL para eviction automática dos buckets de rate limit e cache de leitura
    implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

    // Spring Cache — abstração de cache para leituras frequentes (ex: getSubjects)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Spring Boot Actuator — health check e métricas operacionais
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Spring Boot 4 — modulos de test autoconfigure separados do starter
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'    // @AutoConfigureMockMvc
    testImplementation 'org.springframework.boot:spring-boot-jdbc-test'       // @AutoConfigureTestDatabase
    testRuntimeOnly 'com.h2database:h2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    // 0.8.14 introduz suporte oficial ao Java 25 (class file major version 69)
    toolVersion = '0.8.14'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
    // Exclui classes de infraestrutura que não têm lógica testável diretamente
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/EbbinApplication.class',
                '**/config/AdminInitializer.class',
                '**/config/CacheConfig.class'
            ])
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    // Aplica as mesmas exclusões de infraestrutura que o relatório
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: [
                '**/EbbinApplication.class',
                '**/config/AdminInitializer.class',
                '**/config/CacheConfig.class'
            ])
        }))
    }
    violationRules {
        // Regra AGREGADA: o build inteiro precisa atingir 90/85/90
        rule {
            limit {
                counter = 'INSTRUCTION'
                value   = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
        // Regra PER-CLASS: cada classe individualmente também precisa atingir 90/85/90
        // (previne que classes novas nasçam abaixo da política de cobertura).
        rule {
            element = 'CLASS'
            // Mesmas exclusões da regra agregada já aplicadas via classDirectories.setFrom acima
            // (EbbinApplication, AdminInitializer, CacheConfig). Repositórios JPA são interfaces
            // puras sem código testável — o JaCoCo já as ignora por não emitir counters.
            limit {
                counter = 'INSTRUCTION'
                value   = 'COVEREDRATIO'
                minimum = 0.90
            }
            limit {
                counter = 'BRANCH'
                value   = 'COVEREDRATIO'
                minimum = 0.85
            }
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.90
            }
        }
    }
}

// OWASP Dependency-Check: varredura de CVEs nas dependências (OWASP A06:2021 — Vulnerable Components)
// Executar manualmente: ./gradlew dependencyCheckAnalyze
// O relatório é gerado em build/reports/dependency-check-report.html
dependencyCheck {
    // Falha o build se alguma dependência tiver CVSS >= 7.0 (Alta ou Crítica)
    failBuildOnCVSS = 7.0
    // Diretório de relatórios
    outputDirectory = layout.buildDirectory.dir('reports').get().asFile
    // Formatos de relatório gerados
    formats = ['HTML', 'JSON']
    // Suprimido durante CI off-line: remover esta linha se a NVD API key estiver configurada
    // nvd.apiKey = System.getenv('NVD_API_KEY') ?: ''
    // Exclui dependências de escopo de teste da varredura de produção
    scanConfigurations = ['runtimeClasspath', 'compileClasspath']
}
