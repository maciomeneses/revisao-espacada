# Perfil de PRODUÇÃO — ativado via SPRING_PROFILES_ACTIVE=prod
#
# Diferenças em relação ao perfil padrão (development):
#  - ddl-auto: validate — o Hibernate apenas valida que o schema existente bate com as entidades.
#    Isso previne alterações acidentais de schema em produção.
#  - Flyway habilitado — gerencia migrações versionadas de forma controlada.
#  - logging.level.com.ebbin: INFO — reduz verbosidade de debug em produção.
#
# IMPORTANTE — baseline-version: 15
# O banco de produção (Railway) foi historicamente gerenciado por ddl-auto=update
# (profile default); as migrations V1..V15 NUNCA rodaram lá — o schema equivalente
# foi criado pelo Hibernate. O baseline marca o banco existente como "já na V15":
# na primeira execução o Flyway só registra o baseline e, daí em diante, aplica
# apenas V16+. NÃO reduzir este valor: reaplicar V1..V15 num schema populado
# quebraria (migrations antigas não são idempotentes).
# Pré-requisito para ativar o profile: o deploy com as colunas email_verified (V14)
# e de estado FSRS (V15) precisa ter rodado com sucesso ANTES, pois o ddl-auto:
# validate exige o schema completo e o Flyway (baselinado em 15) não vai criá-las.
spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 15

logging:
  level:
    com.ebbin: INFO
