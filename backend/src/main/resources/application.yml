spring:
  datasource:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:ebbin}
    username: ${PGUSER:ebbin}
    password: ${PGPASSWORD:ebbin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Perfil padrão (desenvolvimento): cria/atualiza schema automaticamente.
      # Em produção, ative o perfil "prod" (SPRING_PROFILES_ACTIVE=prod) para usar "validate"
      # em conjunto com Flyway, que gerencia as migrações de forma controlada.
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    # Flyway desabilitado por padrão; habilitado apenas no perfil "prod" via application-prod.yml
    enabled: false
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}

app:
  jwt:
    secret: ${JWT_SECRET:TroqueEssaChaveEmProducaoComNoMinimo256BitsParaSegurancaAdequadaEmAmbienteRailway}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}  # 24h
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://maciomeneses.github.io}
  admin:
    email: ${ADMIN_EMAIL:admin@ebbin.com}
    password: ${ADMIN_PASSWORD:admin123}
  rate-limit:
    login:
      capacity: ${RATE_LIMIT_LOGIN_CAPACITY:5}
      refill-tokens: ${RATE_LIMIT_LOGIN_REFILL_TOKENS:5}
      refill-minutes: ${RATE_LIMIT_LOGIN_REFILL_MINUTES:1}

logging:
  level:
    com.ebbin: DEBUG
  pattern:
    # Inclui requestId do MDC para correlação de logs em produção.
    # %X{requestId} é removido automaticamente ao final de cada requisição pelo MdcRequestFilter.
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [rid=%X{requestId:-none}] - %msg%n"
